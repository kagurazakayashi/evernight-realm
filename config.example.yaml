# Evernight Realm 服務端配置示例（脫敏模板）
#
# 使用方法：複製本檔案為執行資料目錄中的 config.yaml 後按需修改。
# 本檔案不含任何真實憑據；真實金鑰與配置只存在於 evernight-data/config.yaml，
# 該目錄已被 .gitignore 排除，不會進入版本庫。
#
# 注意：以下鍵為規劃結構，隨開發步驟逐步落地；未實現的鍵將被忽略。

# ---- 伺服器 ----
server:
  listen: "127.0.0.1:5206"          # HTTP 監聽地址；區域網部署時改為主機區域網 IP
  data_dir: "."                     # 執行資料目錄（預設 evernight-data/）
  display_timezone: "Asia/Shanghai" # 伺服器顯示時區；資料庫仍以 UTC 儲存

  # HTTP 層保護參數（單位：毫秒 / 位元組）；request 不得大於 write。
  read_header_timeout_ms: 5000      # 標頭讀取逾時
  read_timeout_ms: 15000            # 整個請求讀取逾時
  write_timeout_ms: 30000           # 回應寫入逾時
  idle_timeout_ms: 60000            # keep-alive 空閒逾時
  request_timeout_ms: 10000         # 單次處理期限（超過回 503）
  max_body_bytes: 1048576           # JSON 請求體上限（1 MiB）
  shutdown_timeout_ms: 10000        # 優雅停止等待進行中請求的上限（逾時強制關閉）

# ---- 資料庫 ----
database:
  path: "evernight.db"              # SQLite 檔案（相對 data_dir）
  busy_timeout_ms: 5000             # 鎖等待超時
  preflight: "header"               # 開庫前預檢：header（檔頭標記，預設）| readonly（另加唯讀連線）| off（不預檢）
  integrity_check: false            # 啟動時執行完整性自檢（大庫可能耗時）；亦可手動 `migrate --verify`
  schema_guard: "startup"           # 寫入把關層級：startup（預設，僅啟動時拒絕不相容版本）| transaction（另於每個寫入交易前複驗 schema 版本）
  # ---- 交易邊界（STEP-041）----
  transaction:
    begin_mode: "immediate"         # 寫入交易的 BEGIN 模式：immediate（預設，失敗點固定於交易開始前）| deferred
    nested: "reject"                # 同一交易內再開交易：reject（預設）| savepoint（真嵌套）| reuse（加入外層）
    busy_retry_max: 0               # 忙鎖時自動重試整個交易的次數（0 為預設，不重試；重試會重跑交易，需幂等）
    busy_retry_backoff_ms: 50       # 重試線性退避基數（毫秒）
    timeout_ms: 10000               # 單一交易執行期限（毫秒）；0 表示不限制

# ---- 儲存目錄 ----
media: "media/"                     # 媒體檔案
documents: "documents/"             # 文件
attachments: "attachments/"         # 附件
backups: "backups/"                 # 備份

# ---- 日誌 ----
logs:
  dir: "logs/"
  level: "info"                     # debug | info | warn | error

# ---- 安全（部署者自行生成，勿在此提交真實值） ----
security:
  session_ttl_hours: 24

  # HTTP 安全回應頭（STEP-035）；留空即用內建預設，只有確實需要時才覆寫。
  # frame_options 可選 DENY | SAMEORIGIN；csp 不得含 'unsafe-eval'。
  headers:
    content_security_policy: ""       # 空 = 內建預設（相容本機 Flutter Web）
    frame_options: ""                 # 空 = DENY
    referrer_policy: ""               # 空 = no-referrer
    permissions_policy: ""            # 空 = camera=(self), microphone=(), geolocation=()
